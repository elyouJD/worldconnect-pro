name: Worker finance tests

on:
  push:
    branches:
      - staging/platform-wallet-sepa
  pull_request:
    branches:
      - staging/platform-wallet-sepa

jobs:
  finance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run finance unit tests
        run: npm test
